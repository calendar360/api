services:
  db:
    image: postgres:18
    container_name: cal360db
    restart: always
    env_file:
      - ./db/.env
    volumes:
      - ./db/data:/var/lib/postgresql
    ports:
      - "4456:5432"
    networks:
      - cal360_net

  api:
    image: davidudoji/cal360api:latest
    container_name: cal360api
    restart: always
    expose:
      - "4455"
    ports:
      - "4455:4000"
    depends_on:
      - db
    env_file:
      - ./api/.env
    volumes:
      - ./api/uploads:/usr/src/app/uploads
      - ./api/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    networks:
      - cal360_net

networks:
  cal360_net:
    driver: bridge
